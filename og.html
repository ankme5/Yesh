<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Laila:wght@400;500&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden;color:#3A2328;display:flex;align-items:center;justify-content:center;gap:70px;background:radial-gradient(60% 80% at 30% 40%,#FFFDF8,#FFF8EF 55%,#F9E4DE)}

.arch{position:relative;width:360px;height:432px;border-radius:50% 50% 16px 16px/41.6% 41.6% 16px 16px;overflow:hidden;background:linear-gradient(180deg,#FDF1E9 0%,#FADBCD 42%,#F3BBA3 66%,#E9A188 69%);box-shadow:0 0 0 7px #FFF8EF,0 0 0 9px #B86B3A,0 30px 60px -24px rgba(126,40,70,.5)}

.al{position:absolute;bottom:31%;transform:translateY(15.15%)}.al.l{left:5%;width:30%}.al.r{right:7%;width:21%}
.lgo{width:100%;display:block;overflow:visible}.ring{fill:none;stroke:var(--mg);stroke-width:1.1}.ring.dots{stroke-width:1.4;stroke-linecap:round;stroke-dasharray:.1 5.2}.lfill{fill:var(--mg);opacity:.2}.lfo,.vn{fill:none;stroke:var(--mg);stroke-linecap:round;stroke-linejoin:round}.lfo{stroke-width:2.4}.vn{stroke-width:1.3}.vn.mid{stroke-width:1.9}.sp{fill:var(--mg)}

<svg width="0" height="0" style="position:absolute"><defs>

<div class="f"></div>

<div class="t"><div class="k">सस्नेह निमंत्रण</div><div class="h">मंगल परिणय</div><div class="n">यश<b>संग</b>कोमल</div><div class="d">शनिवार, 26 दिसम्बर 2026</div><div class="p">ओशो भवन, गुढ़ियारी, रायपुर</div></div>
<script>function logoSVG(){

  var LEAF='M120 60C102 42 48 50 47 98C46 140 90 168 112 198C116 206 118 220 120 236C122 220 124 206 128 198C150 168 194 140 193 98C192 50 138 42 120 60Z';
  var v=''; [[84,52],[108,60],[132,56],[156,44],[180,28]].forEach(function(p){ var y=p[0],w=p[1];
    [-1,1].forEach(function(s){ v+='<path class="vn" d="M120 '+y+'Q'+(120+s*w*.45)+' '+(y-2)+' '+(120+s*w)+' '+(y-18)+'"/>'; }); });
  var L='<path class="lfill" d="'+LEAF+'"/><path class="lfo" d="'+LEAF+'"/><path class="lfo" d="M120 61C121 48 117 36 125 22"/><path class="vn mid" d="M120 62C121 110 121 170 120 228"/>'+v;
  return '<svg class="lgo" viewBox="0 0 240 250" aria-hidden="true">'+

}
function lotusSVG(){
  function P(L,w){ return 'M0 0C'+w+' '+(-L*.28)+' '+(w*.85)+' '+(-L*.76)+' 0 '+(-L)+'C'+(-w*.85)+' '+(-L*.76)+' '+(-w)+' '+(-L*.28)+' 0 0Z'; }
  var s='<svg viewBox="-118 -112 236 132" style="width:100%;display:block;overflow:visible"><ellipse cx="0" cy="6" rx="108" ry="14" fill="url(#padG)"/><path d="M0 2C-30 4-62-2-98-18C-70-26-34-17 0 2Z" fill="url(#leafG)"/><path d="M0 2C30 4 62-2 98-18C70-26 34-17 0 2Z" fill="url(#leafG)"/>';
  [{g:'lpB',L:92,w:24,a:[-78,78,-52,52,-26,26,0]},{g:'lpM',L:86,w:27,a:[-42,42,-15,15]},{g:'lpF',L:72,w:30,a:[-56,56,0]}].forEach(function(l){
    l.a.forEach(function(a){ s+='<path fill="url(#'+l.g+')" stroke="rgba(126,40,70,.28)" stroke-width=".7" transform="rotate('+a+')" d="'+P(l.L,l.w)+'"/>'; }); });
  return s+'</svg>';
}
document.getElementById('lg').innerHTML=logoSVG();
document.querySelectorAll('[data-lotus]').forEach(function(e){ e.innerHTML=lotusSVG(); });</script></body></html>
